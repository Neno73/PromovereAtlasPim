services:
  # PostgreSQL 17
  postgres:
    image: postgres:17-alpine
    container_name: promoatlas-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: promoatlas
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strapi123}
    volumes:
      - promoatlas_postgres:/var/lib/postgresql/data
    networks:
      - promoatlas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d promoatlas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: promoatlas-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - promoatlas_redis:/data
    networks:
      - promoatlas
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch
  meilisearch:
    image: getmeili/meilisearch:v1.41
    container_name: promoatlas-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-promoatlas-dev-key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - promoatlas_meilisearch:/meili_data
    networks:
      - promoatlas
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  promoatlas_postgres:
  promoatlas_redis:
  promoatlas_meilisearch:

networks:
  promoatlas:
    driver: bridge
